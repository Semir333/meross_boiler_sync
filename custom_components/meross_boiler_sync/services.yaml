boost_now:
  target:
    entity:
      integration: meross_boiler_sync
      domain: binary_sensor
  fields:
    minutes:
      required: false
      example: 60
      selector:
        number:
          min: 5
          max: 480
          step: 5
          unit_of_measurement: min
          mode: box
    offset:
      required: false
      example: 2.0
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.5
          unit_of_measurement: °C
          mode: box
cancel_boost_now:
  target:
    entity:
      integration: meross_boiler_sync
      domain: binary_sensor
preheat:
  target:
    entity:
      integration: meross_boiler_sync
      domain: binary_sensor
  fields:
    ready_by:
      required: true
      example: "06:30:00"
      selector:
        time:
    target_temperature:
      required: true
      example: 22
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box
    hold_minutes:
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 480
          step: 5
          unit_of_measurement: min
          mode: box
cancel_preheat:
  target:
    entity:
      integration: meross_boiler_sync
      domain: binary_sensor
